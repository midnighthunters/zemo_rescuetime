name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant to assemble'
        required: true
        type: choice
        options:
          - release
          - standaloneDebug
        default: release
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      BUILD_VARIANT: ${{ inputs.build_variant || 'release' }}
      RCT_NO_LAUNCH_PACKAGER: '1'
      EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY || 'goog_khTLNFYCVMZWcUjZGRBduZPJmnF' }}
      EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID || 'premium_rescuetime' }}
      EXPO_PUBLIC_REVENUECAT_OFFERING_ID: ${{ secrets.EXPO_PUBLIC_REVENUECAT_OFFERING_ID || 'rescuetime_offering' }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_MONTHLY_PRODUCT_ID: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_MONTHLY_PRODUCT_ID || 'rescue_animals_pro_monthly' }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_YEARLY_PRODUCT_ID: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_YEARLY_PRODUCT_ID || 'rescue_animals_pro_yearly' }}
      EXPO_PUBLIC_REMOTE_ASSET_BASE_URL: ${{ secrets.EXPO_PUBLIC_REMOTE_ASSET_BASE_URL || 'https://assets.zemolabs.com/zemo-animal-rescue-assets/v1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Verify bundle size constraints
        run: npm run assets:check-bundle-size

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        shell: bash
        run: chmod +x android/gradlew

      - name: Build Android APK (${{ env.BUILD_VARIANT }})
        shell: bash
        run: |
          set -euo pipefail
          if [ "${BUILD_VARIANT}" = "standaloneDebug" ]; then
            GRADLE_TASK=":app:assembleStandaloneDebug"
          else
            GRADLE_TASK=":app:assembleRelease"
          fi
          echo "Starting Gradle task: ${GRADLE_TASK}"
          cd android
          ./gradlew ${GRADLE_TASK} --no-daemon --stacktrace

      - name: Prepare APK artifact for download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "${APK_FILE}" ]; then
            echo "::error::No APK file found in android/app/build/outputs/apk!"
            exit 1
          fi
          OUTPUT_APK="dist-apk/RescueAnimalsSteps-${BUILD_VARIANT}.apk"
          cp "${APK_FILE}" "${OUTPUT_APK}"
          
          FILE_SIZE=$(ls -lh "${OUTPUT_APK}" | awk '{print $5}')
          SHA256=$(sha256sum "${OUTPUT_APK}" | awk '{print $1}')
          
          echo "APK successfully built: ${OUTPUT_APK} (${FILE_SIZE})"
          echo "SHA256 checksum: ${SHA256}"
          
          echo "OUTPUT_APK_NAME=RescueAnimalsSteps-${BUILD_VARIANT}.apk" >> $GITHUB_ENV
          echo "APK_SIZE=${FILE_SIZE}" >> $GITHUB_ENV
          echo "APK_SHA256=${SHA256}" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RescueAnimalsSteps-${{ env.BUILD_VARIANT }}-APK
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish build summary
        shell: bash
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 📱 Android APK Ready for Download!

          The Android build has succeeded. You can download and install the APK directly onto your Android device.

          | Property | Value |
          |---|---|
          | **Build Variant** | `${{ env.BUILD_VARIANT }}` |
          | **Filename** | `${{ env.OUTPUT_APK_NAME }}` |
          | **Size** | `${{ env.APK_SIZE }}` |
          | **SHA-256** | `${{ env.APK_SHA256 }}` |

          ---

          ### 📲 How to Install on Your Android Device:
          1. Go to the **Summary** tab of this workflow run.
          2. Under **Artifacts** at the bottom, click **RescueAnimalsSteps-${{ env.BUILD_VARIANT }}-APK** to download the zip file.
          3. Extract the downloaded zip file to get `RescueAnimalsSteps-${{ env.BUILD_VARIANT }}.apk`.
          4. Transfer or open the APK on your Android phone (via Google Drive, USB, WhatsApp, or phone browser).
          5. Tap the APK file to install.
             - *If prompted, allow **"Install unknown apps"** in your phone's Settings for your browser or file manager.*
          6. Open **Rescue Animals Steps** and start tracking your steps to rescue animals!
          EOF
